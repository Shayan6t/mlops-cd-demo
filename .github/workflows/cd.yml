name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(cat VERSION)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --build-arg GIT_COMMIT=$(git rev-parse --short HEAD) \
            -t "${IMAGE_NAME}:${{ steps.version.outputs.version }}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Push
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "${IMAGE_NAME}:${{ steps.version.outputs.version }}"
          docker push "${IMAGE_NAME}:latest"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          if [ -n "$STAGING_HOST" ] && [ -n "$STAGING_KEY" ]; then
            echo "Deploying to remote staging host $STAGING_HOST via SSH..."
            mkdir -p ~/.ssh
            echo "$STAGING_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "$STAGING_USER@$STAGING_HOST" \
              "docker pull $IMAGE && docker stop mlops-api || true && docker rm mlops-api || true && docker run -d --name mlops-api --restart unless-stopped -p 5000:5000 $IMAGE"
          else
            echo "No STAGING_HOST configured. Running container staging validation in runner..."
            docker run -d --name mlops-api-staging -p 5000:5000 "$IMAGE"
          fi

      - name: Smoke test
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          sleep 5
          if [ -n "$STAGING_HOST" ]; then
            curl --fail "http://$STAGING_HOST:5000/health"
          else
            curl --fail "http://localhost:5000/health"
            docker stop mlops-api-staging && docker rm mlops-api-staging
          fi

  deploy-production:
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy production
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          if [ -n "$PRODUCTION_HOST" ] && [ -n "$PRODUCTION_KEY" ]; then
            echo "Deploying to remote production host $PRODUCTION_HOST via SSH..."
            mkdir -p ~/.ssh
            echo "$PRODUCTION_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "$PRODUCTION_USER@$PRODUCTION_HOST" \
              "docker pull $IMAGE && docker stop mlops-api || true && docker rm mlops-api || true && docker run -d --name mlops-api --restart unless-stopped -p 5000:5000 $IMAGE"
          else
            echo "Production approval verified. Pulling release artifact to production..."
            docker pull "$IMAGE"
            echo "Production release ${{ needs.build.outputs.version }} delivered successfully!"
          fi
